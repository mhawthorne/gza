# Gza Configuration

project_name: gza
project_id: gza

verify_command: './bin/tests'
unit_verify_command: './bin/test-unit --summary -- tests/ -n 2 --dist loadscope'
autonomous_verify_timeout_seconds: 600
autonomous_verify_bootstrap_timeout_seconds: 600
docker_setup_command: 'uv sync'

spec_coherence:
  enabled: false

branch_strategy: date_slug

max_steps: 100

learnings_max_items: 50
learnings_interval: 10

merge_squash_threshold: 1

max_review_cycles: 4
on_max_cycles: merge_and_defer

advance_mode: iterate

watch:
  batch: 2
  poll: 60
  no_activity_timeout: 120
  no_progress_cycles: 2
  
provider: codex
model: gpt-5.5

# The gza dev repo always uses its own project-local task DB.
# Pin it explicitlyso it ignores any user-level shared db_path in ~/.gza/config.yaml 
# (its dev/test # tasks must never be merged into a personal shared DB).
# Equals the built-in default, so it is a no-op for anyone without a global shared config.
db_path: .gza/gza.db
